detection_id: DET-AUTH-002
name: Password Spraying Authentication Detection
version: "1.0"
status: experimental
description: >
  Detects repeated failed password authentication attempts from a single
  source IP against multiple distinct user accounts within a defined
  time window. The detection is designed to identify password-spraying
  behavior rather than high-volume brute force against a single account.

data_source:
  type: authentication
  protocol: ssh
  event_type: authentication
  required_fields:
    - event_id
    - timestamp
    - source_ip
    - user
    - action
    - status
    - protocol
    - metadata

logic:
  event_filter:
    protocol: ssh
    event_type: authentication
    status: failure
    action: login_failure
    authentication_method: password

  grouping:
    - source_ip

  window:
    minutes: 5

  threshold:
    minimum_failed_attempts: 6
    minimum_distinct_users: 6

  rationale: >
    Password spraying attempts a limited number of passwords against
    multiple accounts. Requiring both a minimum number of failures and
    a minimum number of distinct targeted users reduces overlap with
    single-account brute-force detection.

  escalation:
    successful_authentication_from_source: true
    escalation_severity: high

severity:
  base: medium
  escalated: high

confidence:
  base: medium
  escalated: high

mitre_attack:
  tactic: credential-access
  technique: T1110
  subtechnique: T1110.003
  technique_name: Password Spraying

false_positives:
  - Authorized administrative testing against multiple accounts
  - Security validation or penetration-testing activity
  - Misconfigured automation using a shared source
  - Centralized authentication infrastructure generating repeated failures
  - Legitimate users repeatedly attempting authentication during an outage

false_negatives:
  - Distributed spraying across many source IP addresses
  - Attempts spread across windows longer than five minutes
  - Password spraying against fewer than six accounts
  - Telemetry missing source IP or username fields
  - Authentication systems that do not expose password authentication events

testing:
  positive:
    dataset: telemetry/authentication/CASE-002-authentication-events.jsonl
    expected_result: triggered
    expected_source_ip: 198.51.100.40
    expected_distinct_users: 7
    expected_failed_attempts: 13
    expected_successful_authentication: true
    expected_success_event_id: EVT-002008

  negative:
    conditions:
      - A single account receives repeated failures without multiple targeted users
      - Fewer than six distinct users are targeted within five minutes
      - Normal public-key authentication from expected sources
    expected_result: not_triggered

limitations:
  - The detection operates only on available synthetic authentication telemetry.
  - It does not establish that an account was compromised.
  - A successful authentication is observed evidence and requires additional
    identity, endpoint, and network investigation.
  - Distributed password spraying may evade source-IP-only grouping.
  - Thresholds require tuning against a larger baseline of legitimate activity.

analyst_guidance:
  initial_action: >
    Validate the source IP, targeted accounts, authentication method,
    timestamps, and whether the activity was authorized.
  investigation_priority: >
    Determine whether the source targeted additional accounts or hosts
    and investigate any successful authentication following the failures.
  evidence_classification: observed_evidence
